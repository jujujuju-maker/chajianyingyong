<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16221b">
  <title>时间档案 · Time Archive</title>
  <style>
    :root{--ink:#172019;--muted:#68736b;--paper:#f3f1e9;--card:#fffdf7;--line:#dcd9ce;--accent:#27664a;--accent2:#dce9df;--danger:#9b3b32;--shadow:0 12px 34px rgba(31,42,34,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 72px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{margin:0;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:1px 0 0;font:700 clamp(28px,6vw,48px)/1.08 Georgia,"Songti SC",serif}.sub{margin:8px 0 0;color:var(--muted)}
    .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:18px}.composer{display:grid;grid-template-columns:1fr 310px;gap:16px}.composer textarea{min-height:174px;resize:vertical}.guide{padding:14px 16px;background:#e9e5d8;border-radius:14px;color:#566057}.guide strong{color:var(--ink)}.guide code{font-family:ui-monospace,monospace;color:var(--accent)}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(39,102,74,.12)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:white;padding:9px 14px;font-weight:700}.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.btn.danger{background:transparent;color:var(--danger);border-color:#dbbcb8}.btn:hover{filter:brightness(.96)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:14px 16px;background:rgba(255,253,247,.72);border:1px solid var(--line);border-radius:14px}.stat b{display:block;font:700 25px/1.1 Georgia,serif}.stat span{font-size:12px;color:var(--muted)}
    .toolbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:minmax(180px,1fr) 150px 140px 150px;gap:9px;padding:12px;margin:0 0 16px;background:rgba(243,241,233,.92);backdrop-filter:blur(14px);border:1px solid rgba(220,217,206,.8);border-radius:15px}
    .list{display:grid;gap:13px}.card{padding:19px}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.date{font-weight:800;color:var(--accent);letter-spacing:.02em}.title{margin:3px 0 8px;font:700 21px/1.35 Georgia,"Songti SC",serif}.content,.note{white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:13px}.tag{display:inline-flex;padding:2px 9px;border-radius:99px;background:var(--accent2);color:var(--accent);font-weight:700}.source a{color:var(--accent);word-break:break-all}.card-actions{display:flex;gap:7px;flex:none}.icon-btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 9px;color:var(--muted)}.icon-btn:hover{color:var(--ink);background:#f4f1e7}
    .empty{text-align:center;padding:55px 20px;color:var(--muted)}dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:18px;padding:0;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(17,25,20,.48);backdrop-filter:blur(3px)}.modal{padding:22px}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field textarea{min-height:110px;resize:vertical}.toast{position:fixed;right:18px;bottom:18px;z-index:20;padding:10px 14px;border-radius:10px;background:var(--ink);color:white;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){.shell{width:min(100% - 20px,1080px);padding-top:18px}.composer{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.toolbar{position:static;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.card-top{display:block}.card-actions{margin-top:10px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><p class="eyebrow">Personal chronology</p><h1>时间档案</h1><p class="sub">把零散资料整理成可检索、可备份的个人时间线。</p></div><button class="btn secondary" id="backupBtn">备份 / 恢复</button></header>
  <section class="panel composer" aria-labelledby="importTitle">
    <div><label id="importTitle" for="rawInput"><strong>批量录入资料</strong></label><textarea id="rawInput" placeholder="2026-08-05&#10;项目正式启动&#10;今天完成了第一版方案……&#10;&#10;2026-08-12&#10;第一次复盘&#10;记录关键结论……"></textarea><div class="actions"><button class="btn" id="parseBtn">解析并加入档案</button><button class="btn secondary" id="newBtn">手动新建</button><button class="btn secondary" id="clearInputBtn">清空输入</button></div></div>
    <aside class="guide"><strong>识别格式</strong><br>每条记录以 <code>YYYY-MM-DD</code> 开头；日期后的第一行作为标题，其余内容作为正文。支持 <code>YYYY/MM/DD</code>，会自动去重，并保留已有编辑内容。</aside>
  </section>
  <section class="stats" aria-label="档案概览"><div class="stat"><b id="totalStat">0</b><span>全部记录</span></div><div class="stat"><b id="visibleStat">0</b><span>当前结果</span></div><div class="stat"><b id="yearStat">—</b><span>时间跨度</span></div><div class="stat"><b id="sourceStat">0</b><span>含来源记录</span></div></section>
  <section class="toolbar" aria-label="筛选工具"><input id="searchInput" type="search" placeholder="搜索标题、内容、来源、备注…" aria-label="搜索"><select id="yearFilter" aria-label="按年份筛选"><option value="">全部年份</option></select><select id="monthFilter" aria-label="按月份筛选"><option value="">全部月份</option></select><select id="sortSelect" aria-label="排序"><option value="desc">日期：从新到旧</option><option value="asc">日期：从旧到新</option></select></section>
  <section id="list" class="list" aria-live="polite"></section>
</main>

<dialog id="editDialog"><form method="dialog" class="modal" id="editForm"><h2 id="dialogTitle">编辑记录</h2><input type="hidden" id="editId"><div class="form-grid"><div class="field"><label for="editDate">日期</label><input id="editDate" type="date" required></div><div class="field"><label for="editStatus">状态</label><input id="editStatus" placeholder="例如：已完成 / 待核实"></div><div class="field full"><label for="editTitle">事件标题</label><input id="editTitle" required maxlength="200"></div><div class="field full"><label for="editContent">具体内容</label><textarea id="editContent"></textarea></div><div class="field full"><label for="editSource">来源链接或出处</label><input id="editSource" placeholder="https://… 或书名、文件名"></div><div class="field full"><label for="editNote">备注</label><textarea id="editNote"></textarea></div></div><div class="actions"><button class="btn" value="save" id="saveEditBtn">保存</button><button class="btn secondary" value="cancel">取消</button></div></form></dialog>
<dialog id="backupDialog"><div class="modal"><h2>备份与恢复</h2><p>建议定期导出 JSON 完整备份；CSV 适合在 Excel 中查看。</p><div class="actions"><button class="btn" id="exportJsonBtn">导出完整备份</button><button class="btn secondary" id="exportCsvBtn">导出 CSV</button><button class="btn secondary" id="importJsonBtn">导入备份</button><input id="fileInput" type="file" accept="application/json,.json" hidden><button class="btn secondary" id="closeBackupBtn">关闭</button><button class="btn danger" id="clearAllBtn">清空全部</button></div></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'timeArchive9';
  const LEGACY_KEY = 'timeArchive8';
  const $ = id => document.getElementById(id);
  const els = Object.fromEntries(['rawInput','searchInput','yearFilter','monthFilter','sortSelect','list','totalStat','visibleStat','yearStat','sourceStat','editDialog','backupDialog','editForm','editId','editDate','editTitle','editContent','editSource','editStatus','editNote','fileInput','toast'].map(id => [id,$(id)]));
  let db = load();

  function uid(){ return (crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`); }
  function normalize(item){ return {id:item.id||uid(),date:String(item.date||'').slice(0,10).replaceAll('/','-'),title:String(item.title||''),content:String(item.content||''),source:String(item.source||''),status:String(item.status||''),note:String(item.note||''),updatedAt:item.updatedAt||new Date().toISOString()}; }
  function load(){
    try {
      const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if(Array.isArray(current)) return current.map(normalize);
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
      const migrated = Array.isArray(legacy) ? legacy.map(normalize) : [];
      if(migrated.length) localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
      return migrated;
    } catch { return []; }
  }
  function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); }
  function escapeHtml(value){ return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }
  function isUrl(value){ try { const u=new URL(value); return ['http:','https:'].includes(u.protocol); } catch { return false; } }
  function formatDate(value){ const [y,m,d]=value.split('-'); return y&&m&&d ? `${y} 年 ${Number(m)} 月 ${Number(d)} 日` : value; }
  function notify(message){ els.toast.textContent=message;els.toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>els.toast.classList.remove('show'),2200); }

  function parseText(text){
    const re=/(?<!\d)(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?!\d)/g;
    const matches=[...text.matchAll(re)];
    return matches.map((match,index)=>{
      const date=`${match[1]}-${match[2].padStart(2,'0')}-${match[3].padStart(2,'0')}`;
      const body=text.slice(match.index+match[0].length,matches[index+1]?.index??text.length).trim();
      const lines=body.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
      return normalize({date,title:lines.shift()||'未命名事件',content:lines.join('\n')});
    });
  }
  function addParsed(){
    const text=els.rawInput.value.trim(); if(!text) return notify('请先粘贴需要整理的资料');
    const parsed=parseText(text); if(!parsed.length) return notify('没有识别到日期，请使用 YYYY-MM-DD 格式');
    let added=0,skipped=0;
    parsed.forEach(item=>{ const duplicate=db.some(x=>x.date===item.date&&x.title.trim()===item.title.trim()&&x.content.trim()===item.content.trim()); duplicate?skipped++:(db.push(item),added++); });
    save();refreshFilters();render();els.rawInput.value='';notify(`已加入 ${added} 条${skipped?`，跳过 ${skipped} 条重复记录`:''}`);
  }
  function filtered(){
    const key=els.searchInput.value.trim().toLocaleLowerCase(); const y=els.yearFilter.value; const m=els.monthFilter.value;
    return db.filter(x=>(!y||x.date.startsWith(y))&&(!m||x.date.slice(5,7)===m)&&(!key||[x.date,x.title,x.content,x.source,x.status,x.note].join('\n').toLocaleLowerCase().includes(key))).sort((a,b)=>els.sortSelect.value==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
  }
  function refreshFilters(){
    const currentY=els.yearFilter.value,currentM=els.monthFilter.value;
    const years=[...new Set(db.map(x=>x.date.slice(0,4)).filter(Boolean))].sort().reverse();
    els.yearFilter.innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${escapeHtml(y)}">${escapeHtml(y)} 年</option>`).join('');
    els.monthFilter.innerHTML='<option value="">全部月份</option>'+Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option value="${m}">${Number(m)} 月</option>`).join('');
    if(years.includes(currentY)) els.yearFilter.value=currentY; els.monthFilter.value=currentM;
  }
  function render(){
    const rows=filtered();
    els.totalStat.textContent=db.length;els.visibleStat.textContent=rows.length;els.sourceStat.textContent=db.filter(x=>x.source.trim()).length;
    const years=db.map(x=>x.date.slice(0,4)).filter(Boolean).sort();els.yearStat.textContent=years.length?(years[0]===years.at(-1)?years[0]:`${years[0]}–${years.at(-1)}`):'—';
    if(!rows.length){ els.list.innerHTML=`<div class="panel empty">${db.length?'没有符合当前筛选条件的记录。':'还没有档案。粘贴资料解析，或手动新建第一条记录。'}</div>`;return; }
    els.list.innerHTML=rows.map(x=>{ const source=x.source.trim(); const sourceHtml=source?(isUrl(source)?`<a href="${escapeHtml(source)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source)}</a>`:escapeHtml(source)):''; return `<article class="card"><div class="card-top"><div><div class="date">${escapeHtml(formatDate(x.date))}</div><h2 class="title">${escapeHtml(x.title)}</h2></div><div class="card-actions"><button class="icon-btn" data-action="edit" data-id="${x.id}" aria-label="编辑 ${escapeHtml(x.title)}">编辑</button><button class="icon-btn" data-action="delete" data-id="${x.id}" aria-label="删除 ${escapeHtml(x.title)}">删除</button></div></div>${x.content?`<div class="content">${escapeHtml(x.content)}</div>`:''}<div class="meta">${x.status?`<span class="tag">${escapeHtml(x.status)}</span>`:''}${sourceHtml?`<span class="source">来源：${sourceHtml}</span>`:''}${x.note?`<span class="note">备注：${escapeHtml(x.note)}</span>`:''}</div></article>`; }).join('');
  }
  function openEditor(id=''){
    const x=db.find(v=>v.id===id)||normalize({date:new Date().toLocaleDateString('sv-SE')});
    els.editId.value=id;els.editDate.value=x.date;els.editTitle.value=x.title;els.editContent.value=x.content;els.editSource.value=x.source;els.editStatus.value=x.status;els.editNote.value=x.note;$('dialogTitle').textContent=id?'编辑记录':'新建记录';els.editDialog.showModal();setTimeout(()=>els.editTitle.focus(),0);
  }
  function saveEditor(event){
    event.preventDefault(); if(!els.editForm.reportValidity()) return;
    const item=normalize({id:els.editId.value||uid(),date:els.editDate.value,title:els.editTitle.value.trim(),content:els.editContent.value.trim(),source:els.editSource.value.trim(),status:els.editStatus.value.trim(),note:els.editNote.value.trim()});
    const index=db.findIndex(x=>x.id===item.id); index<0?db.push(item):db.splice(index,1,item);save();refreshFilters();render();els.editDialog.close();notify(index<0?'记录已创建':'修改已保存');
  }
  function download(name,content,type){ const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
  function csvCell(v){ return `"${String(v??'').replaceAll('"','""')}"`; }
  function exportCsv(){ const rows=[['日期','事件标题','具体内容','来源','状态','备注'],...db.map(x=>[x.date,x.title,x.content,x.source,x.status,x.note])];download(`TimeArchive_${new Date().toLocaleDateString('sv-SE')}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8'); }
  function exportJson(){ download(`TimeArchive_backup_${new Date().toLocaleDateString('sv-SE')}.json`,JSON.stringify({version:9,exportedAt:new Date().toISOString(),records:db},null,2),'application/json'); }
  async function importJson(file){
    try{ const data=JSON.parse(await file.text());const rows=Array.isArray(data)?data:data.records;if(!Array.isArray(rows))throw new Error();const incoming=rows.map(normalize);const map=new Map(db.map(x=>[x.id,x]));incoming.forEach(x=>map.set(x.id,x));db=[...map.values()];save();refreshFilters();render();els.backupDialog.close();notify(`已恢复 ${incoming.length} 条记录`); }catch{ notify('备份文件格式不正确'); }
  }

  $('parseBtn').addEventListener('click',addParsed);$('newBtn').addEventListener('click',()=>openEditor());$('clearInputBtn').addEventListener('click',()=>{els.rawInput.value='';els.rawInput.focus();});
  [els.searchInput,els.yearFilter,els.monthFilter,els.sortSelect].forEach(el=>el.addEventListener(el===els.searchInput?'input':'change',render));
  els.list.addEventListener('click',e=>{ const button=e.target.closest('button[data-action]');if(!button)return;const {action,id}=button.dataset;if(action==='edit')openEditor(id);if(action==='delete'){const x=db.find(v=>v.id===id);if(x&&confirm(`确定删除“${x.title}”吗？`)){db=db.filter(v=>v.id!==id);save();refreshFilters();render();notify('记录已删除');}} });
  els.editForm.addEventListener('submit',saveEditor);$('backupBtn').addEventListener('click',()=>els.backupDialog.showModal());$('closeBackupBtn').addEventListener('click',()=>els.backupDialog.close());$('exportJsonBtn').addEventListener('click',exportJson);$('exportCsvBtn').addEventListener('click',exportCsv);$('importJsonBtn').addEventListener('click',()=>els.fileInput.click());els.fileInput.addEventListener('change',()=>{if(els.fileInput.files[0])importJson(els.fileInput.files[0]);els.fileInput.value='';});
  $('clearAllBtn').addEventListener('click',()=>{if(db.length&&confirm('确定清空全部档案吗？此操作无法撤销，建议先导出备份。')){db=[];save();refreshFilters();render();els.backupDialog.close();notify('全部档案已清空');}});
  [els.editDialog,els.backupDialog].forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();}));
  refreshFilters();render();
})();
</script>
</body>
</html>
