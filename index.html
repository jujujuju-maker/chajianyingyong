<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时间档案 v9</title>
<style>
:root{--bg:#f4f3ee;--card:#fff;--text:#20211f;--muted:#777870;--line:#e4e2db;--accent:#216651;--soft:#edf4f1}
*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{width:100%;max-width:760px;margin:0 auto;padding:14px 12px 80px}
h1{margin:3px 0 14px;font-size:22px}
.panel,.record{width:100%;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,.045)}
.panel{padding:13px;margin-bottom:13px}
textarea,input,select{display:block;width:100%;max-width:100%;border:1px solid #d8d7d1;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);font:inherit;overflow-wrap:anywhere;word-break:break-word}
textarea{min-height:210px;resize:vertical;line-height:1.55}
button{border:0;border-radius:10px;padding:10px 13px;background:#222;color:#fff;font:inherit;font-weight:650;cursor:pointer}
button.secondary{background:#ecebe6;color:#222}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.controls{position:sticky;top:0;z-index:10;background:rgba(244,243,238,.96);backdrop-filter:blur(8px);padding:9px 0 11px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.filters button{grid-column:1/-1}
.count{font-size:13px;color:var(--muted);margin:8px 2px 0}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:#d5dcd8}
.record{position:relative;padding:15px;margin:14px 0;overflow:hidden}
.record:before{content:"";position:absolute;left:-19px;top:23px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.date{display:inline-block;max-width:100%;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:750;overflow-wrap:anywhere;word-break:break-word}
.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:14px 0 5px}
.title,.content,.source,.status,.note{width:100%;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.title{font-size:17px;font-weight:760;line-height:1.45}
.content,.source,.note{font-size:15px;line-height:1.72}
.source a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere;word-break:break-all}
.status{font-size:14px;font-weight:700}
.cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cardActions button{font-size:13px;padding:7px 10px}
.editor{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.editor.open{display:block}
.editor label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.editor textarea{min-height:88px}
.empty{background:#fff;border:1px dashed #d6d4cd;border-radius:16px;text-align:center;color:var(--muted);padding:42px 16px}
@media(max-width:420px){.app{padding-left:9px;padding-right:9px}.record{padding:13px}.title{font-size:16px}.content,.source,.note{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<h1>时间档案</h1>
<div class="panel">
<textarea id="rawInput" placeholder="粘贴时间资料。每条记录以独立日期行开头。"></textarea>
<div class="actions">
<button onclick="parseReplace()">解析并替换</button>
<button class="secondary" onclick="parseAppend()">解析并追加</button>
<button class="secondary" onclick="addBlank()">手动新建</button>
<button class="secondary" onclick="exportCSV()">导出全部 Excel</button>
</div>
</div>
<div class="controls">
<input id="search" type="search" placeholder="🔎 搜索事件、内容、来源、备注" oninput="render()">
<div class="filters">
<select id="yearPicker" onchange="render()"><option value="">全部年份</option></select>
<select id="monthPicker" onchange="render()"><option value="">全部月份</option></select>
<button class="secondary" onclick="resetFilters()">清除筛选</button>
</div>
<div id="count" class="count"></div>
</div>
<main id="timeline" class="timeline"></main>
</div>
<script>
const KEY="time_archive_v9";let records=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(records))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function linkify(s=""){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function dateLine(s){return /^\s*\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?(?:\s*[～~至—–]\s*(?:(?:\d{4}[-/.年])?\d{1,2}[-/.月]\d{1,2}日?)?\s*$/.test(s)}
function normalizeDate(s){return s.trim().replace(/年/g,"-").replace(/月/g,"-").replace(/日/g,"").replace(/\//g,"-").replace(/\./g,"-").replace(/\s+/g,"")}
function parseText(text){
 const lines=text.replace(/\r/g,"").split("\n"),starts=[];lines.forEach((line,i)=>{if(dateLine(line))starts.push(i)});const out=[];
 for(let n=0;n<starts.length;n++){
  const start=starts[n],end=n+1<starts.length?starts[n+1]:lines.length,date=normalizeDate(lines[start]),body=lines.slice(start+1,end);
  while(body.length&&!body[0].trim())body.shift();while(body.length&&!body[body.length-1].trim())body.pop();
  const clean=body.map(x=>x.trim()).filter(Boolean);let title=clean[0]||"",rest=clean.slice(1),status="";
  if(rest.length&&/^(已确认|待补|待核查|未确认)$/.test(rest[rest.length-1]))status=rest.pop();
  let source=[],content=[];for(const line of rest){if(/https?:\/\//i.test(line)||/^(来源|来源链接|待补：|待补:)/.test(line)||/官方/.test(line))source.push(line);else content.push(line)}
  out.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date,title,content:content.join("\n"),source:source.join("\n"),status:status||"待补",note:""});
 }
 return out;
}
function parseReplace(){const parsed=parseText(rawInput.value);if(!parsed.length){alert("没有识别到独立日期行");return}records=parsed;save();updatePickers();render();alert("已识别 "+parsed.length+" 条记录")}
function parseAppend(){const parsed=parseText(rawInput.value);if(!parsed.length){alert("没有识别到独立日期行");return}records=records.concat(parsed);sortRecords();save();updatePickers();render();alert("已追加 "+parsed.length+" 条记录")}
function sortRecords(){records.sort((a,b)=>a.date.localeCompare(b.date))}
function addBlank(){records.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:"",title:"",content:"",source:"",status:"待补",note:""});save();render();setTimeout(()=>toggleEdit(records[0].id),50)}
function updatePickers(){const y=yearPicker,m=monthPicker,oldY=y.value,oldM=m.value,years=[...new Set(records.map(r=>r.date.slice(0,4)).filter(Boolean))].sort();y.innerHTML='<option value="">全部年份</option>'+years.map(v=>`<option value="${esc(v)}">${esc(v)}年</option>`).join("");m.innerHTML='<option value="">全部月份</option>'+Array.from({length:12},(_,i)=>{const v=String(i+1).padStart(2,"0");return `<option value="${v}">${i+1}月</option>`}).join("");if(years.includes(oldY))y.value=oldY;m.value=oldM}
function resetFilters(){search.value="";yearPicker.value="";monthPicker.value="";render()}
function visibleRecords(){const q=search.value.trim().toLowerCase(),y=yearPicker.value,m=monthPicker.value;return records.filter(r=>{const text=[r.date,r.title,r.content,r.source,r.status,r.note].join(" ").toLowerCase();return(!q||text.includes(q))&&(!y||r.date.startsWith(y+"-"))&&(!m||r.date.slice(5,7)===m)})}
function render(){sortRecords();const data=visibleRecords();count.textContent=`共 ${records.length} 条 · 当前显示 ${data.length} 条`;timeline.innerHTML=data.length?data.map(cardHTML).join(""):'<div class="empty">没有符合条件的记录</div>'}
function cardHTML(r){return `<article class="record" id="record-${r.id}"><div class="date">${esc(r.date||"未填写日期")}</div><div class="label">事件</div><div class="title">${esc(r.title||"未填写事件")}</div><div class="label">具体内容</div><div class="content">${esc(r.content||"暂无")}</div><div class="label">来源链接</div><div class="source">${r.source?linkify(r.source):"待补"}</div><div class="label">状态</div><div class="status">${esc(r.status||"待补")}</div>${r.note?`<div class="label">备注</div><div class="note">${esc(r.note)}</div>`:""}<div class="cardActions"><button class="secondary" onclick="toggleEdit('${r.id}')">编辑</button><button class="secondary" onclick="removeRecord('${r.id}')">删除</button></div><div class="editor" id="editor-${r.id}"><label>日期</label><input id="date-${r.id}" value="${esc(r.date)}"><label>事件</label><input id="title-${r.id}" value="${esc(r.title)}"><label>具体内容</label><textarea id="content-${r.id}">${esc(r.content)}</textarea><label>来源链接</label><textarea id="source-${r.id}">${esc(r.source)}</textarea><label>状态</label><input id="status-${r.id}" value="${esc(r.status)}"><label>备注</label><textarea id="note-${r.id}">${esc(r.note)}</textarea><div class="actions"><button onclick="saveEdit('${r.id}')">保存修改</button><button class="secondary" onclick="toggleEdit('${r.id}')">取消</button></div></div></article>`}
function toggleEdit(id){const el=document.getElementById("editor-"+id);if(el)el.classList.toggle("open")}
function saveEdit(id){const r=records.find(x=>x.id===id);if(!r)return;r.date=document.getElementById("date-"+id).value.trim();r.title=document.getElementById("title-"+id).value.trim();r.content=document.getElementById("content-"+id).value.trim();r.source=document.getElementById("source-"+id).value.trim();r.status=document.getElementById("status-"+id).value.trim();r.note=document.getElementById("note-"+id).value.trim();save();updatePickers();render()}
function removeRecord(id){if(!confirm("确定删除这条记录？"))return;records=records.filter(x=>x.id!==id);save();updatePickers();render()}
function exportCSV(){const rows=[["日期","事件标题","具体内容","来源链接","状态","备注"]];records.forEach(r=>rows.push([r.date,r.title,r.content,r.source,r.status,r.note]));const csv=rows.map(row=>row.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="TimeArchive.csv";a.click();URL.revokeObjectURL(a.href)}
updatePickers();render();
</script>
</body>
</html>
